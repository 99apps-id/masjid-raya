name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          # Nilai dummy khusus CI: build tidak memakai sesi sungguhan,
          # hanya butuh variabelnya terdefinisi seperti .env.example.
          NEXTAUTH_SECRET: ci-dummy-secret-untuk-build-saja
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: file:./dev.db
