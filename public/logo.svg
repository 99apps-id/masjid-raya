<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e6241"/>
      <stop offset="1" stop-color="#063925"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5d77f"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#b07f22"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#04261a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="80" cy="80" r="74" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <circle cx="80" cy="80" r="70" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="80" cy="80" r="66" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Mihrab Arch Silhouette -->
  <path d="M80 32 C64 45.8 54.6 55.8 54.6 70.6 V106 H105.4 V70.6 C105.4 55.8 96 45.8 80 32 Z" 
        stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" fill="#072b1d"/>

  <!-- Dome Finial -->
  <circle cx="80" cy="28" r="3.8" fill="url(#goldGrad)"/>
  <path d="M80 22 V28" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Crescent Moon (Hilal) inside Mihrab -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#goldGrad)"
        d="M66.5 73.5 C66.5 82.6 73.9 90 83 90 C87.2 90 91 88.4 93.9 85.8 C85.6 86.4 78.4 79.5 78.4 71 C78.4 66.8 80 63 82.6 60.1 C73.5 61.2 66.5 66.5 66.5 73.5 Z"/>

  <!-- Minaret & Star Accents -->
  <circle cx="87.5" cy="65.5" r="2.2" fill="url(#goldGrad)"/>
</svg>
