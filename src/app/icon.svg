<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Masjid Raya Pro">
  <defs>
    <linearGradient id="mrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e6241" />
      <stop offset="100%" stop-color="#043823" />
    </linearGradient>
    <linearGradient id="mrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7a1" />
      <stop offset="50%" stop-color="#d99b26" />
      <stop offset="100%" stop-color="#b47816" />
    </linearGradient>
  </defs>

  <!-- Latar Belakang Perisai Geometris -->
  <rect width="48" height="48" rx="11" fill="url(#mrBgGrad)" />
  <rect x="1.5" y="1.5" width="45" height="45" rx="9.5" fill="none" stroke="url(#mrGoldGrad)" stroke-width="0.8" stroke-opacity="0.45" />

  <!-- Menara Kiri -->
  <path d="M 8.5 40 L 8.5 19 L 10.5 19 L 10.5 40 Z" fill="#0b482f" />
  <path d="M 7.5 19 L 11.5 19 L 9.5 14 Z" fill="url(#mrGoldGrad)" />
  <line x1="9.5" y1="14" x2="9.5" y2="11.5" stroke="url(#mrGoldGrad)" stroke-width="0.8" stroke-linecap="round" />
  <circle cx="9.5" cy="11" r="0.8" fill="url(#mrGoldGrad)" />

  <!-- Menara Kanan -->
  <path d="M 37.5 40 L 37.5 19 L 39.5 19 L 39.5 40 Z" fill="#0b482f" />
  <path d="M 36.5 19 L 40.5 19 L 38.5 14 Z" fill="url(#mrGoldGrad)" />
  <line x1="38.5" y1="14" x2="38.5" y2="11.5" stroke="url(#mrGoldGrad)" stroke-width="0.8" stroke-linecap="round" />
  <circle cx="38.5" cy="11" r="0.8" fill="url(#mrGoldGrad)" />

  <!-- Dinding Utama & Garis Dasar Bangunan -->
  <path d="M 10.5 40 L 10.5 28 L 37.5 28 L 37.5 40 Z" fill="#073320" />
  <line x1="6" y1="40" x2="42" y2="40" stroke="url(#mrGoldGrad)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Kubah Utama (Siluet Ogee) -->
  <path d="M 14 28 C 14 20 18.5 13.5 24 9 C 29.5 13.5 34 20 34 28 Z" fill="url(#mrGoldGrad)" />
  <path d="M 15.5 28 C 15.5 21.5 19.5 15.5 24 11.5 C 28.5 15.5 32.5 21.5 32.5 28 Z" fill="#0e6241" opacity="0.35" />

  <!-- Finial Puncak & Bulan Sabit (Hilal) -->
  <line x1="24" y1="9" x2="24" y2="5" stroke="url(#mrGoldGrad)" stroke-width="1" stroke-linecap="round" />
  <path d="M 23.2 4.2 A 2.2 2.2 0 1 1 25.4 6.4 A 1.8 1.8 0 1 0 23.2 4.2 Z" fill="url(#mrGoldGrad)" />

  <!-- Gerbang Lengkung Mihrab -->
  <path d="M 19.5 40 L 19.5 31 C 19.5 28 21.5 26.5 24 25 C 26.5 26.5 28.5 28 28.5 31 L 28.5 40 Z" fill="#032014" stroke="url(#mrGoldGrad)" stroke-width="0.85" stroke-linejoin="round" />

  <!-- Bintang Delapan Islam (Khatam) -->
  <g transform="translate(24, 18.5) scale(0.65)" fill="url(#mrGoldGrad)">
    <rect x="-3" y="-3" width="6" height="6" rx="0.5" />
    <rect x="-3" y="-3" width="6" height="6" rx="0.5" transform="rotate(45)" />
    <circle cx="0" cy="0" r="1" fill="#0e6241" />
  </g>
</svg>
